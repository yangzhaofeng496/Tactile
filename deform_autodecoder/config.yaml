# Deform autoencoder 配置

model:
  # 图纸里固定为 128，对应 latent z: [B, 128, 15, 15]
  latent_channels: 128

  # 重建输出激活函数
  # 可选: identity / sigmoid / tanh
  output_activation: identity

loss:
  # 像素级重建损失
  # 可选: mse / l1 / huber
  pixel_loss_type: mse

  # 边缘损失权重
  # 总损失: L = L_pixel + edge_weight * L_edge
  edge_weight: 0.1

training:
  # batch size
  batch_size: 16

  # AdamW 学习率
  learning_rate: 1e-4

  # AdamW 权重衰减
  weight_decay: 1e-5

  # 训练轮数
  num_epochs: 20

  # DataLoader worker 数
  num_workers: 0

  # 训练设备
  # 可选: cuda / cpu
  # 若填 cuda 但当前环境无 GPU，会自动退回 cpu
  device: cuda

  # 每多少个 step 打印一次训练日志
  log_every: 10

  # checkpoint 保存目录
  save_dir: deform_autodecoder/checkpoints

wandb:
  # 是否启用 wandb
  enabled: true

  # wandb project 名称
  project: deform-autodecoder

  # run 名称；为空时自动生成
  run_name: ""

  # 上传图片的频率，单位 epoch
  log_images_every: 1

  # 每次每个 split 最多上传多少张图片
  num_images: 4

  # 训练阶段每隔多少个 batch 上传一次图片
  # 仅对 train split 生效
  log_train_images_every_batches: 100

data:
  # 数据来源
  # 可选:
  #   tensor      -> 直接读取 torch.load() 保存的张量
  #   dataloader  -> 使用 deform_autodecoder/dataloader.py
  source: dataloader

  # 当 source=tensor 时使用
  # 文件应满足 torch.load(path) -> Tensor
  # 支持形状:
  #   [N, 240, 240]
  #   [N, 1, 240, 240]
  train_tensor_path: ""
  val_tensor_path: ""
  # 为空时默认复用 val_tensor_path
  test_tensor_path: ""

  # 当 source=dataloader 时使用
  # 这里定义 deform_autodecoder 自己的 LeRobot 读取配置
  dataloader:
    # 可以是 Hugging Face repo_id，也可以是本地 LeRobot 数据集目录
    repo_id: /home/yang/TactileEncoder/dataset/so101/dm_200

    # 从 Hub 加载时设为 null；本地目录加载时可继续保持 null
    root: null
    revision: null

    # 视频解码后端
    # 可选: pyav / torchcodec
    video_backend: torchcodec

    # 触觉图像键，支持单个键或左右两个键列表
    # 当前默认对接你现有数据里已经确认存在的 distforce 图像键
    tactile_image:
      - observation.images.left_dm_distforce
      # - observation.images.right_dm_distforce

    # 历史帧长度，包含当前帧
    tactile_history: 16

    split:
      train: 0.70
      val: 0.15
      test: 0.15
      seed: 42

    loader:
      pin_memory: true
      persistent_workers: true
      # 先在数据集层面把可用索引随机打散，避免按时间顺序展开
      randomize_indices: true

      # DataLoader 级别的 shuffle
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last_train: false

preprocess:
  # 从 tactile_history 中取哪一帧
  # -1 表示最后一帧，也就是当前时刻
  history_index: -1

  # 从拼接后的通道中，从哪个位置开始取
  # 例如左右 RGB 图像拼接后，总通道数是 6：
  #   0 表示左侧的 3 通道
  #   3 表示右侧的 3 通道
  channel_start: 0

  # 参与重建的通道数
  # 你现在要学习三通道，所以这里设为 3
  num_channels: 3

  # 是否把输入 resize 到 target_size
  # 设为 false 时保持数据原始尺寸
  resize_to_model_input: false

  # 仅当 resize_to_model_input=true 时使用
  target_size: [240, 240]
