# 完全缓存模式开关：
#   true  -> 从离线缓存读取全部训练输入（tactile/force/state/action/visual），
#            完全脱离LeRobotDataset，不解码任何视频。
#            需 policy.act_cache_path 指向 --full-cache 生成的缓存。
#   false -> 走原dataloader管线（需要时实时加载/解码）。
use_cache_loader: true

dataset:
  repo_id: "/home/yang/TactileEncoder/dataset/so101/950+50hil_8.25"
  root: null
  revision: null
  video_backend: "torchcodec"

  keys:
    tactile_type: "vqvae"

    # 历史力数据（VQ-VAE编码器输入）
    tactile_force:
      - "observation.tactile.left_force"
      - "observation.tactile.right_force"

    # 触觉通道顺序（需与model_config和stats文件一致）
    tactile_force_channel_order:
      - left_Fx
      - left_Fy
      - left_Fz
      - left_Mx
      - left_My
      - left_Mz
      - right_Fx
      - right_Fy
      - right_Fz
      - right_Mx
      - right_My
      - right_Mz

    # 当前力数据（CurrentForceEncoder输入）
    current_force:
      - "observation.tactile.left_force"
      - "observation.tactile.right_force"

    # 机器人状态（StateEncoder输入）
    state: "observation.state"

    # 专家动作（目标输出）
    expert_action: "action"

  # ACT策略使用的观测字段
  act_observation_keys:
    - "observation.state"
    - "observation.images.side"
    - "observation.images.top"
    - "observation.images.wrist_cam"

sequence:
  tactile_history_force: 16  # 历史力时间步数（需与VQ-VAE的history_steps=16一致）
  action_horizon: 30         # 动作预测时间步数

policy:
  type: "act"
  pretrained_path: "/home/yang/TactileEncoder/actmodel/dm/dm_act_orin_350_reinforce/checkpoints/100000"
  revision: null
  device: "cuda"
  use_postprocessor: true
  # 开启后从冻结ACT的transformer encoder输出中提取视觉token，
  # 输入残差网络一起训练（需同时开启config/model_config.yaml中act_visual.enabled）。
  use_act_visual: true
  # 离线预处理缓存：设置后训练直接从缓存读取act_chunk/act_visual，不再实时运行ACT。
  # 生成方式: python dataloader/preprocess_act_cache.py --config dataloader/tactile_dataloader.yaml
  act_cache_path: "/home/yang/TactileEncoder/outputs/act_cache/act_cache_600.pt"

split:
  train: 0.90
  val: 0.1
  test: 0.0
  seed: 11

loader:
  batch_size: 16
  window_stride: 1
  train_window_fraction: 0.5  # 每个episode随机采样50%合法窗口，保持各组可比并缩短实验周期
  pair_adjacent_windows: true  # action consistency实验专用开关
  balance_current_force: false
  hard_replay_fraction: 0.0  # offline DAgger proxy开关，默认关闭
  # 按专家动作变化和ACT残差的组合分数对训练窗口加权采样。
  # score = 0.5*mean(||expert[t+1]-expert[t]||)
  #       + 0.5*mean(||expert-act_chunk||)
  # 0=关闭；1=线性偏向高运动/高修正窗口；2=更强偏向高运动窗口。
  motion_sampling_power: 1.0
  motion_sampling_floor: 0.05  # 静态窗口最低保留采样权重
  motion_action_change_weight: 0.5
  motion_residual_weight: 0.5
  late_episode_threshold: 0.7  # episode后70%视为后半段
  late_episode_weight: 1.5  # 后半段高运动/高修正窗口额外权重
  match_val_distribution: false  # 仅用验证集的受力-动作联合分布重采样训练窗口
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  shuffle_train: true
  drop_last_train: false

test:
  num_batches: 2
