# 完全缓存模式开关：
#   true  -> 从离线缓存读取全部训练输入（tactile/force/state/action/visual），
#            完全脱离LeRobotDataset，不解码任何视频。
#            需 policy.act_cache_path 指向 --full-cache 生成的缓存。
#   false -> 走原dataloader管线（需要时实时加载/解码）。
use_cache_loader: true

dataset:
  repo_id: "/home/yang/TactileEncoder/dataset/0821/0814_800"
  root: null
  revision: null
  video_backend: "torchcodec"

  keys:

    # 机器人状态（StateEncoder输入）
    state: "observation.state"

    # 专家动作（目标输出）
    expert_action: "action"

  # ACT策略使用的观测字段
  act_observation_keys:
    - "observation.state"
    - "observation.images.left_close"
    - "observation.images.up_cam"
    - "observation.images.right_close"

sequence:
  tactile_history_force: 16  # 历史力时间步数（需与VQ-VAE的history_steps=16一致）
  action_horizon: 30         # 动作预测时间步数

policy:
  type: "act"
  pretrained_path: "/home/yang/TactileEncoder/dataset/0821/act_peg_optical_module_0814_800_image_transforms/checkpoints/300001"
  revision: null
  device: "cuda"
  use_postprocessor: true
  # 开启后从冻结ACT的transformer encoder输出中提取视觉token，
  # 输入残差网络一起训练（需同时开启config/model_config.yaml中act_visual.enabled）。
  use_act_visual: true
  # 离线预处理缓存：设置后训练直接从缓存读取act_chunk/act_visual，不再实时运行ACT。
  # 生成方式: python dataloader/preprocess_act_cache.py --config dataloader/tactile_dataloader.yaml
  act_cache_path: "/home/yang/TactileEncoder/outputs/act_cache/act_cache_800_optical.pt"

split:
  train: 0.80
  val: 0.0
  test: 0.1
  seed: 11

loader:
  batch_size: 16
  window_stride: 1
  train_window_fraction: 0.25  # 每个episode随机采样25%合法窗口，保持各组可比并缩短实验周期
  pair_adjacent_windows: false  # action consistency实验专用开关
  balance_current_force: false
  hard_replay_fraction: 0.0  # offline DAgger proxy开关，默认关闭
  match_val_distribution: false  # 仅用验证集的受力-动作联合分布重采样训练窗口
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  shuffle_train: true
  drop_last_train: false

test:
  num_batches: 2
