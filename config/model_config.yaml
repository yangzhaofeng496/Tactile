# TactileResidualACT 模型配置文件

# 触觉编码器类型选择
tactile_encoder:
  # 触觉历史分支开关:
  #   true  -> 使用触觉历史输入 (由下方 type 决定编码器: vqvae/force/image)
  #   false -> 完全移除触觉历史分支，模型只使用 current_force + state + act_chunk (+visual)
  enabled: false
  # 可选: "force", "image", 或 "vqvae"
  # - "force": 使用1D时间卷积处理6维合力历史 (输入: [B, 16, 6])
  # - "image": 使用2D卷积处理触觉图像 (输入: [B, 10, 6, 288, 384])
  # - "vqvae": 使用预训练的VQ-VAE编码器处理历史力数据 (输入: [B, T, D])
  type: "vqvae"

  # 合力编码器参数 (当 type="force" 时使用)
  force:
    input_dim: 12         # 输入维度 (左右各6维，拼接后12维)
    hidden_dim: 64        # 隐藏层维度
    output_dim: 512       # 输出维度
    history_length: 30    # 历史时间步数
    channel_order:
      - left_Fx
      - left_Fy
      - left_Fz
      - left_Mx
      - left_My
      - left_Mz
      - right_Fx
      - right_Fy
      - right_Fz
      - right_Mx
      - right_My
      - right_Mz

  # 图像编码器参数 (当 type="image" 时使用)
  image:
    in_channels: 6        # 输入通道数 (左右触觉拼接)
    history_length: 10    # 历史帧数
    image_size: [288, 384]  # 图像尺寸 [H, W]

  # VQ-VAE编码器参数 (当 type="vqvae" 时使用)
  vqvae:
    input_dim: 12                    # 输入维度 (与VQ-VAE训练时一致)
    output_dim: 512                  # 输出维度 (码本向量维度)
    history_length: 16               # 历史时间步数 (必须与VQ-VAE训练时一致=16)
    vqvae_config_path: "/home/yang/TactileEncoder/TactileSelfencoder/vqvae_config.yaml"
    vqvae_checkpoint_path: "/home/yang/TactileEncoder/TactileSelfencoder/vqvae_checkpoints/decoder_mlp/16tokens/checkpoint_epoch_200.pth"
    freeze: true                     # 是否冻结VQ-VAE参数

# 当前力编码器参数 (新增)
current_force_encoder:
  input_dim: 12          # 当前时刻的12维力（左右各6维拼接）
  hidden_dim: 32         # 隐藏层维度
  output_dim: 36         # 输出维度（进一步压缩模型）
  normalize_input: false
  # stats_path: "/home/yang/TactileEncoder/dataloader/util/tactile_analysis/current_force_stats.json"

# 状态编码器参数
state_encoder:
  input_dim: 6
  hidden_dim: 32
  output_dim: 36
  normalize_input: true
  stats_path: "/home/yang/TactileEncoder/dataloader/util/tactile_analysis/state_stats.json"
  channel_order:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

# 动作编码器参数
action_encoder:
  input_dim: 180           # 30步 × 6维
  hidden_dim: 80
  output_dim: 72

# ACT视觉token编码器参数 (可选)
# enabled: true时，将冻结ACT transformer encoder输出的视觉token
# 经mean pooling后接入融合模块，与触觉/力/状态/动作一起训练。
# 需要dataloader yaml中policy.use_act_visual也同时开启。
act_visual:
  enabled: true
  input_dim: 512           # ACT的dim_model
  output_dim: 72           # 视觉token编码后维度（进一步压缩模型）
  pooling: "mean"          # 当前仅支持"mean"

# 根据当前力动态调制融合特征（FiLM）
force_film:
  enabled: false
  hidden_dim: 64

# 融合模块参数
fusion:
  type: "multihead"
  input_dim: 216           # 36(current_force) + 36(state) + 72(action) + 72(visual)
  hidden_dim: 96
  output_dim: 80
  num_heads: 8
  dropout: 0.1

# 残差解码器参数
decoder:
  input_dim: 80
  hidden_dim: 48
  output_dim: 180         # 30步 × 6轴delta
  action_horizon: 30
  action_dim: 6
  single_step_delta: false

# 训练参数
training:
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_epochs: 300
  device: "cuda"
  validate_every: 1
  checkpoint_every: 10
  checkpoint_dir: "/home/yang/TactileEncoder/residual_actmodel/experiments/400_50hil_820_halfparams_full_head8"
  log_every: 10
  diagnostic_topk: 3
  diagnostic_val_batches: 1
  overfit_single_batch_steps: 0
  resume_checkpoint: null
  override_tactile_loss_from_checkpoint: false
  use_tactile_weighted_loss: false
  tactile_weight_tau: 1.3
  tactile_weight_alpha: 2.0
  tactile_weight_slope: 5.0
  tactile_weight_eps: 1e-6
  tactile_stats_paths:
    force: "/home/yang/TactileEncoder/dataloader/util/tactile_analysis/tactile_stats.json"
    vqvae: "/home/yang/TactileEncoder/dataloader/util/tactile_analysis/tactile_stats.json"
    image: null  # 提供图像触觉统计文件；若输入已标准化，可使用匹配通道数的零均值/单位方差统计
  tactile_stats_path: "/home/yang/TactileEncoder/dataloader/util/tactile_analysis/tactile_stats.json"  # 兼容旧配置；仅在 tactile_stats_paths 缺失时回退
  tactile_input_already_normalized: false
  action_noise_std: 0.0  # 仅训练时加入到ACT action chunk的高斯噪声标准差
  current_force_noise_std: 0.05
  state_noise_std: 0.05
  temporal_smoothness_weight: 0.01
  action_chunk_consistency_weight: 0.0
  modality_dropout_prob: 0.0
  ablate_modalities: []
  current_force_gain_range: 0.0
  overfit_monitor:
    enabled: false
    patience: 3
    min_relative_test_increase: 0.01
  reference_dropout: 0.03  # train阶段每个可训练参数元素置零的概率
  adaptive_dropout_on_test_increase: true
  test_mse_dropout_increase: 0
  max_reference_dropout: 0
