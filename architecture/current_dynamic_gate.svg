<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#555"/></marker><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#222}.box{stroke-width:2;rx:10}.input{fill:#fff2cc;stroke:#d6b656}.enc{fill:#d5e8d4;stroke:#82b366}.gate{fill:#e1d5e7;stroke:#9673a6}.fusion{fill:#dae8fc;stroke:#6c8ebf}.out{fill:#ffe6cc;stroke:#d79b00}.line{stroke:#555;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="2200" height="900" fill="white"/>
<text x="1100" y="42" text-anchor="middle" font-size="28" font-weight="bold">TactileResidualACT：动态 Modality Gate + Head Gate</text>
<text x="1100" y="72" text-anchor="middle" font-size="15">当前配置：触觉历史关闭；4 个模态；4 个 Fusion Head</text>

<rect class="box input" x="30" y="130" width="170" height="58"/><text x="115" y="155" text-anchor="middle" font-size="15">当前力</text><text x="115" y="177" text-anchor="middle" font-size="13">[B, 12]</text>
<rect class="box enc" x="235" y="125" width="205" height="68"/><text x="337" y="151" text-anchor="middle" font-size="14">CurrentForceEncoder</text><text x="337" y="174" text-anchor="middle" font-size="13">→ [B, 36]</text>
<rect class="box input" x="30" y="245" width="170" height="58"/><text x="115" y="270" text-anchor="middle" font-size="15">机器人状态</text><text x="115" y="292" text-anchor="middle" font-size="13">[B, 6]</text>
<rect class="box enc" x="235" y="240" width="205" height="68"/><text x="337" y="266" text-anchor="middle" font-size="14">StateEncoder</text><text x="337" y="289" text-anchor="middle" font-size="13">→ [B, 36]</text>
<rect class="box input" x="30" y="360" width="170" height="58"/><text x="115" y="385" text-anchor="middle" font-size="15">ACT 动作块</text><text x="115" y="407" text-anchor="middle" font-size="13">[B, 30, 6]</text>
<rect class="box enc" x="235" y="355" width="205" height="68"/><text x="337" y="381" text-anchor="middle" font-size="14">ActionEncoder</text><text x="337" y="404" text-anchor="middle" font-size="13">→ [B, 72]</text>
<rect class="box input" x="30" y="475" width="170" height="58"/><text x="115" y="500" text-anchor="middle" font-size="15">ACT 视觉 tokens</text><text x="115" y="522" text-anchor="middle" font-size="13">[B, S, 512]</text>
<rect class="box enc" x="235" y="470" width="205" height="68"/><text x="337" y="496" text-anchor="middle" font-size="14">VisualTokenEncoder</text><text x="337" y="519" text-anchor="middle" font-size="13">mean pool → [B, 72]</text>

<rect class="box fusion" x="510" y="285" width="245" height="105"/><text x="632" y="318" text-anchor="middle" font-size="15" font-weight="bold">特征拼接</text><text x="632" y="345" text-anchor="middle" font-size="14">[B, 36+36+72+72]</text><text x="632" y="370" text-anchor="middle" font-size="14" font-weight="bold">= [B, 216]</text>
<rect class="box gate" x="820" y="140" width="320" height="135"/><text x="980" y="170" text-anchor="middle" font-size="16" font-weight="bold">动态 Modality Gate</text><text x="980" y="198" text-anchor="middle" font-size="13">Linear(216→32) → GELU</text><text x="980" y="220" text-anchor="middle" font-size="13">→ Linear(32→4) → Softmax</text><text x="980" y="250" text-anchor="middle" font-size="13">当前力 / 状态 / 动作 / 视觉</text>
<rect class="box gate" x="820" y="320" width="320" height="80"/><text x="980" y="350" text-anchor="middle" font-size="15" font-weight="bold">按模态分块加权</text><text x="980" y="376" text-anchor="middle" font-size="13">每个样本一组 modality 权重</text>
<rect class="box gate" x="820" y="470" width="320" height="110"/><text x="980" y="502" text-anchor="middle" font-size="16" font-weight="bold">动态 Head Gate</text><text x="980" y="530" text-anchor="middle" font-size="13">Linear(216→32) → GELU</text><text x="980" y="552" text-anchor="middle" font-size="13">→ Linear(32→4) → Softmax</text>
<text x="1390" y="265" text-anchor="middle" font-size="16" font-weight="bold">4 个独立并行 Fusion Head</text>
<rect class="box fusion" x="1180" y="285" width="170" height="70"/><text x="1265" y="313" text-anchor="middle" font-size="15" font-weight="bold">Head 1</text><text x="1265" y="337" text-anchor="middle" font-size="12">Linear→96→Norm</text>
<rect class="box fusion" x="1370" y="285" width="170" height="70"/><text x="1455" y="313" text-anchor="middle" font-size="15" font-weight="bold">Head 2</text><text x="1455" y="337" text-anchor="middle" font-size="12">Linear→96→Norm</text>
<rect class="box fusion" x="1180" y="380" width="170" height="70"/><text x="1265" y="408" text-anchor="middle" font-size="15" font-weight="bold">Head 3</text><text x="1265" y="432" text-anchor="middle" font-size="12">Linear→96→Norm</text>
<rect class="box fusion" x="1370" y="380" width="170" height="70"/><text x="1455" y="408" text-anchor="middle" font-size="15" font-weight="bold">Head 4</text><text x="1455" y="432" text-anchor="middle" font-size="12">Linear→96→Norm</text>
<rect class="box fusion" x="1180" y="490" width="360" height="75"/><text x="1360" y="520" text-anchor="middle" font-size="15" font-weight="bold">按 Head Gate 权重加权求和</text><text x="1360" y="545" text-anchor="middle" font-size="13">→ [B, 96] + Residual Skip</text>
<rect class="box fusion" x="1640" y="350" width="350" height="115"/><text x="1815" y="385" text-anchor="middle" font-size="16" font-weight="bold">Fusion FFN</text><text x="1815" y="415" text-anchor="middle" font-size="14">96→80→80，GELU/Dropout</text><text x="1815" y="443" text-anchor="middle" font-size="14">输出 [B, 80]</text>
<rect class="box out" x="1640" y="535" width="350" height="105"/><text x="1815" y="570" text-anchor="middle" font-size="16" font-weight="bold">ResidualDecoder</text><text x="1815" y="598" text-anchor="middle" font-size="14">80→48→180，Reshape</text><text x="1815" y="622" text-anchor="middle" font-size="14">Δpred [B, 30, 6]</text>
<rect class="box out" x="2030" y="535" width="145" height="70"/><text x="2102" y="565" text-anchor="middle" font-size="15" font-weight="bold">预测残差</text><text x="2102" y="588" text-anchor="middle" font-size="12">[B,30,6]</text>
<rect class="box input" x="1985" y="675" width="205" height="88"/><text x="2087" y="708" text-anchor="middle" font-size="14" font-weight="bold">Loss</text><text x="2087" y="733" text-anchor="middle" font-size="12">MSE(Δpred, Δtarget)</text><text x="2087" y="751" text-anchor="middle" font-size="12">Δtarget=专家−ACT</text>
<rect x="30" y="650" width="410" height="78" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="7 5" rx="10"/><text x="235" y="682" text-anchor="middle" font-size="13" fill="#666">触觉历史分支当前关闭</text><text x="235" y="706" text-anchor="middle" font-size="12" fill="#666">enabled:false；开启后额外加入 VQ-VAE 特征</text>

