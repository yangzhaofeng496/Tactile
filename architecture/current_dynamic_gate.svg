<path class="line" d="M1265 355V490"/><path class="line" d="M1455 355V490"/><path class="line" d="M1265 450V490"/><path class="line" d="M1455 450V490"/><path class="line" d="M1540 527H1590V407H1640"/><path class="line" d="M1815 465V535"/><path class="line" d="M1990 587H2030"/><path class="line dash" d="M2102 605V675"/>
